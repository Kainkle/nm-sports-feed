name: build-feed

on:
  repository_dispatch:
    # The chain worker (feed-ticker.yml) arms a tick every 10 min — the trigger of
    # record since 2026-08-30, when the */5 cron below executed only ~6 times a day.
    types: [feed-tick]
  schedule:
    # Kept as a free redundant trigger; the chain sets the real cadence. Best-effort —
    # measured 2026-08-30: gaps of 3-5 h with every status page green.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# The job commits back to this repo, so it needs write access to contents.
permissions:
  contents: write

concurrency:
  # A late run must not stack on top of a running one and produce conflicting commits.
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build feed
        # `continue-on-error` is deliberate. A partial feed is a degraded product; a failed job that
        # commits nothing leaves the last good feed in place, which is the correct outcome. What must never
        # happen is committing an empty feed over a working one.
        run: python -m sportsdata.build --days 2 --out feed
      - name: Commit if changed
        run: |
          git config user.name "nm-sports-feed bot"
          git config user.email "actions@github.com"
          # Guard against publishing an empty feed. If the build produced no events, every source failed at
          # once and the previous file is strictly better than what we just made.
          COUNT=$(python -c "import json;print(len(json.load(open('feed/events.json'))['events']))")
          echo "events: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "empty feed - refusing to commit"; exit 0; fi
          git add feed/
          git diff --staged --quiet || git commit -m "feed: $COUNT events [skip ci]"
          # The chain (feed-ticker.yml) arms a build every 10 min and the */5 cron still fires
          # occasionally, so two builds can overlap. The concurrency group QUEUES them; the second
          # push then loses the race. Rebase and push again instead of failing a green build.
          git push || (git pull --rebase origin main && git push)
